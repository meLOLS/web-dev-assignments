<!DOCTYPE html>
<html>

<head>
    <title>Chat To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My Task Chat</h1>

        <div class="chat-box" id="taskList">
            <!-- Tasks will appear here -->
        </div>


        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter your task">

            <button id="addBtn">
                Add
            </button>
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
